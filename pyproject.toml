[project]
name = "apix"
version = "0.1.0"
description = "Test API CLI"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pathvalidate>=3.3.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
apix = "apix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
